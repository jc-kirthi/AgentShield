[project]
name = "agentshield"
version = "2.0.0"
description = "AgentShield: Independent security and control layer for AI agents on SAP-style ERP APIs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "httpx>=0.27.0",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.0",
    "rapidfuzz>=3.6.0",
    "reportlab>=4.1.0",
    "pypdf>=4.0.0",
    "structlog>=24.1.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
